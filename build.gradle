plugins {
    id 'fabric-loom' version '1.15.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        // Trinkets, Cardinal Components API, Cosmetic Armor Updated y
        // Armor Model API se distribuyen todos via Modrinth Maven.
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // --- Trinkets (ORIGINAL, de emilyploszaj) v3.10.0 — CONFIRMADO para 1.21.1 ---
    modImplementation "maven.modrinth:trinkets:3.10.0"

    // --- Cardinal Components API v6.1.3 — CONFIRMADO, soporta 1.21–1.21.1 ---
    modImplementation "maven.modrinth:cardinal-components-api:6.1.3"

    // --- Cosmetic Armor Updated ---
    // Confirmaste que tenés instalada la versión 1.7.0. Ese número de versión
    // se reutilizó para varias builds de MC en paralelo (vi 1.21.9, 1.21.10,
    // 1.21.11 todas publicadas como "1.7.0"), así que lo más probable es que
    // sea el mismo string para tu 1.21.1. Si el build falla acá, es la señal
    // de que tu build puntual tiene otro número — mirá el nombre real del
    // .jar en tu carpeta mods/ para confirmar.
    modImplementation "maven.modrinth:cosmetic-armor-updated:1.7.0"

    // ArmorRenderLib SACADA del proyecto: ni el original ni el fork "Directors
    // Cut" llegan a 1.21.x (se quedaron en 1.19.2 y 1.20.1 respectivamente,
    // ambos sin mantenimiento hace años). El croptop ahora se renderiza
    // directo contra el ArmorRenderer que ya trae Fabric API — ver
    // CroptopArmorRenderProvider.java. Una dependencia menos.

    // --- Armor Model API v1.0.0+1.21.1 ---
    // Nombre de archivo SIN el símbolo "+" a propósito: combinado con
    // espacios en la ruta de la carpeta (Windows), el "+" puede romper el
    // cálculo de hash de Loom. Renombrá el jar descargado a este nombre
    // exacto al ponerlo en libs/ — ver README.
    //
    // OJO: solo modImplementation, sin include(...) — Loom's include()
    // (jar-in-jar) espera una dependencia de módulo real, no un archivo
    // suelto, y tirar el mismo files(...) ahí rompe la build. Como
    // consecuencia, Armor Model API NO queda embebido dentro del jar final
    // de femclothes — hay que instalarlo aparte en la carpeta mods/ del
    // juego (además de compilarlo acá para poder programar contra su API).
    modImplementation files("libs/armor-model-api-1.0.0-1.21.1.jar")
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
