plugins {
    id 'fabric-loom'
}

version = '0.1.0'
group = 'com.ejemplo'

base {
    archivesName = 'sublimadora'
}

repositories {
    maven {
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // Misma base que femclothes: si se separan, los dos mods dejan de poder
    // convivir en el mismo runtime de desarrollo.
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // GeckoLib 4.8.4 para 1.21.1 (id de version de Modrinth, que es
    // inequivoco). NO subir a 4.9+: esas se compilaron con Loom 1.17.13 y
    // nuestro Loom 1.15.3 las rechaza de entrada — "Mod was built with a
    // newer version of Loom". 4.8.4 usa Loom 1.10.5, verificado en el
    // Fabric-Loom-Version de su MANIFEST.
    // GeckoLib 4.7.7 (id de version de Modrinth, inequivoco).
    //
    // NO subir a 4.8.x: con 4.8.4 los cubos cuyo uv_size por cara NO cubre la
    // tile entera simplemente no se dibujan. El bloque quedaba invisible salvo
    // el display, sin un solo error en el log. Verificado con A/B: mismo
    // modelo y misma textura, cambiando solo la version.
    //
    // Tampoco a 4.9+, por otro motivo: esas se compilaron con Loom 1.17.13 y
    // nuestro Loom 1.15.3 las rechaza. 4.7.7 usa Loom 1.10.5.
    modImplementation "maven.modrinth:geckolib:6UTA5nCc"

    // Camerapture 1.10.12 (id de version, inequivoco): de aca sale el UUID de
    // la foto, via su componente PICTURE_DATA. Es compileOnly y opcional en
    // runtime — la sublimadora funciona sin el, solo que no vas a tener fotos.
    // Compilada con Loom 1.7.435, por debajo de nuestro 1.15.3.
    modCompileOnly "maven.modrinth:camerapture:RYOi2mzR"
    modLocalRuntime "maven.modrinth:camerapture:RYOi2mzR"

}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // Sello de build. El mod lo loguea al arrancar y asi se puede contestar
    // "¿el cliente abierto tiene mis cambios?" comparando contra este archivo,
    // sin discutir.
    //
    // Tiene que ser un RECURSO y no un hash de las clases: en el cliente de
    // desarrollo Loom remapea el jar de intermediary a nombres yarn, con lo
    // cual los .class cambian de bytes aunque el codigo sea identico y
    // cualquier huella calculada sobre ellos da distinto siempre. Los
    // recursos, en cambio, pasan tal cual por el remapeo.
    def sello = new Date().format("yyyy-MM-dd HH:mm:ss")
    inputs.property "sello", sello          // fuerza rearmado en cada build
    doLast {
        new File(destinationDir, "sublimadora_build.txt").text = sello
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
